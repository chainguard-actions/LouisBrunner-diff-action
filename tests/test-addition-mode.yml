name: Test addition mode with added lines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files (new has extra lines = better in addition mode)
        run: |
          printf "A\nB\nC\nD\n" > /tmp/old.txt
          printf "A\nB\nC\nD\nE\n" > /tmp/new.txt

      - id: action
        uses: .
        with:
          old: /tmp/old.txt
          new: /tmp/new.txt
          mode: addition
          tolerance: better

      - name: Assert passed is true (additions are better in addition mode)
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected passed=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: correctly identified additions as better in addition mode"

      - name: Assert output contains diff
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual output: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff output is present"
