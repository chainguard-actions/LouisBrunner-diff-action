name: Test tolerance failure - diff is worse than expected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixture files
        run: |
          printf 'line1\nline2\nline3\nline4\n' > /tmp/file-base.txt
          printf 'line1\nline2\nline3\nline4\nline5\nline6\n' > /tmp/file-more-lines.txt

      - id: diff
        uses: .
        continue-on-error: true
        with:
          old: /tmp/file-base.txt
          new: /tmp/file-more-lines.txt
          mode: deletion
          tolerance: better

      - name: Assert step outcome is failure (action calls setFailed when tolerance not met)
        env:
          OUTCOME: ${{ steps.diff.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome=failure when tolerance is not met"
            exit 1
          fi
          echo "PASS"

      - name: Assert passed is false (adding lines is worse in deletion mode)
        env:
          ACTUAL: ${{ steps.diff.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected passed=false when lines are added in deletion mode with tolerance=better"
            exit 1
          fi
          echo "PASS"

      - name: Assert output is non-empty (diff should still be reported)
        env:
          ACTUAL: ${{ steps.diff.outputs.output }}
        run: |
          echo "actual output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty diff output even when tolerance fails"
            exit 1
          fi
          echo "PASS"
