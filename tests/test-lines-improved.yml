name: Test deletion mode improved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files where new has fewer lines (improved in deletion mode)
        run: |
          printf "line1\nline2\nline3\nline4\nline5\n" > /tmp/old.txt
          printf "line1\nline2\nline3\n" > /tmp/new.txt

      - id: diff
        uses: .
        with:
          old: /tmp/old.txt
          new: /tmp/new.txt
          mode: deletion
          tolerance: better

      - name: Assert passed is true (fewer lines = better in deletion mode)
        env:
          ACTUAL: ${{ steps.diff.outputs.passed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.diff.outputs.output }}
        run: |
          echo "actual output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty output"
            exit 1
          fi
          echo "PASS"
