name: Test mixed tolerance - both added and removed lines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixture files
        run: |
          printf 'line1\nline2\nline3\nline4\n' > /tmp/file-base.txt
          printf 'line1\nlineX\nline3\nlineY\n' > /tmp/file-mixed.txt

      - id: diff
        uses: .
        with:
          old: /tmp/file-base.txt
          new: /tmp/file-mixed.txt
          mode: addition
          tolerance: mixed

      - name: Assert passed is true (mixed result meets mixed tolerance)
        env:
          ACTUAL: ${{ steps.diff.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected passed=true when result is mixed and tolerance is mixed"
            exit 1
          fi
          echo "PASS"

      - name: Assert output is non-empty (diff should be reported)
        env:
          ACTUAL: ${{ steps.diff.outputs.output }}
        run: |
          echo "actual output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty diff output"
            exit 1
          fi
          echo "PASS"
