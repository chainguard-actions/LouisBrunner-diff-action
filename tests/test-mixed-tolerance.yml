name: Test mixed tolerance - equal additions and deletions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          old: ${{ github.workspace }}/fixtures/file1_basic.txt
          new: ${{ github.workspace }}/fixtures/file5_mixed.txt
          mode: deletion
          tolerance: mixed

      - name: Assert passed is true (equal adds/removes = mixed, tolerance=mixed passes)
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected passed=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output contains diff markers
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty diff output"
            exit 1
          fi
          echo "PASS"
