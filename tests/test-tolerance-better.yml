name: Test tolerance better mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files where new is smaller (better in deletion mode)
        run: |
          printf "line1\nline2\nline3\nline4\nline5\n" > /tmp/old_big.txt
          printf "line1\nline2\nline3\n" > /tmp/new_small.txt

      - id: diff
        uses: .
        with:
          old: /tmp/old_big.txt
          new: /tmp/new_small.txt
          mode: deletion
          tolerance: better

      - name: Assert passed is true (new file has fewer lines, better in deletion mode)
        env:
          ACTUAL: ${{ steps.diff.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected passed=true with tolerance=better when new file is smaller in deletion mode, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
