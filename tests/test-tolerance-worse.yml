name: Test tolerance worse - always passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          old: ${{ github.workspace }}/fixtures/file1_basic.txt
          new: ${{ github.workspace }}/fixtures/file4_added.txt
          mode: deletion
          tolerance: worse

      - name: Assert passed is true (tolerance=worse accepts any result)
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected passed=true with tolerance=worse but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
