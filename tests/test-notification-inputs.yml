name: Test notification inputs (token, title, notify_issue, notify_check)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create identical test files
        run: |
          echo "line1" > /tmp/notify_old.txt
          echo "line2" >> /tmp/notify_old.txt
          echo "line3" >> /tmp/notify_old.txt
          cp /tmp/notify_old.txt /tmp/notify_new.txt

      - id: diff
        uses: .
        with:
          old: /tmp/notify_old.txt
          new: /tmp/notify_new.txt
          mode: deletion
          tolerance: same
          token: ${{ github.token }}
          title: "Test Diff Notification"
          notify_issue: "false"
          notify_check: "false"

      - name: Assert passed is true
        env:
          ACTUAL: ${{ steps.diff.outputs.passed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output is present (even if empty for identical files)
        env:
          ACTUAL: ${{ steps.diff.outputs.output }}
        run: |
          echo "actual output: '$ACTUAL'"
          echo "PASS: output field is accessible"
