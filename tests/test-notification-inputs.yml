name: Test notification inputs (token, title, notify_issue, sticky_comment, notify_check)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture files
        run: |
          printf 'A\nB\nC\nD\n' > /tmp/file_old.txt
          printf 'A\nB\nC\nD\n' > /tmp/file_new.txt

      - id: action
        uses: .
        with:
          old: /tmp/file_old.txt
          new: /tmp/file_new.txt
          mode: strict
          tolerance: same
          token: fake-token-for-testing
          title: "Test Diff Title"
          notify_issue: "false"
          sticky_comment: "false"
          notify_check: "false"
        continue-on-error: true

      - name: Assert passed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
