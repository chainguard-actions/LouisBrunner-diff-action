name: Test notification inputs (token, title, notify_issue, sticky_comment, notify_check)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create identical test files
        run: |
          echo "line1" > /tmp/old-notify.txt
          echo "line1" > /tmp/new-notify.txt

      - id: action
        uses: .
        with:
          old: /tmp/old-notify.txt
          new: /tmp/new-notify.txt
          mode: strict
          tolerance: same
          token: ${{ github.token }}
          title: "Test Notification Title"
          notify_issue: "false"
          sticky_comment: "false"
          notify_check: "false"

      - name: Assert passed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected passed=true for identical files"
            exit 1
          fi
          echo "PASS"
