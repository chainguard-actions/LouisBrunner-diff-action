name: Test output file writing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          old: ${{ github.workspace }}/fixtures/file1_basic.txt
          new: ${{ github.workspace }}/fixtures/file4_added.txt
          mode: strict
          tolerance: same
          output: /tmp/diff-output.txt

      - name: Assert output file was created
        run: |
          if [ ! -f /tmp/diff-output.txt ]; then
            echo "FAIL: output file /tmp/diff-output.txt was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat /tmp/diff-output.txt
          echo "PASS: output file exists"

      - name: Assert output file is non-empty
        run: |
          SIZE=$(wc -c < /tmp/diff-output.txt)
          echo "Output file size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          echo "PASS: output file has content"

      - name: Assert passed output matches expected (strict mode, files differ)
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected passed=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
