name: Test output file writing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture files
        run: |
          printf 'A\nB\nC\nD\n' > /tmp/file_old.txt
          printf 'A\nB\nC\nD\nE\n' > /tmp/file_new.txt

      - id: action
        uses: .
        with:
          old: /tmp/file_old.txt
          new: /tmp/file_new.txt
          mode: addition
          tolerance: better
          output: /tmp/diff_output.txt

      - name: Assert output file was created
        run: |
          if [ ! -f /tmp/diff_output.txt ]; then
            echo "FAIL: output file /tmp/diff_output.txt was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat /tmp/diff_output.txt
          echo "PASS: output file exists"

      - name: Assert output step output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty output but got empty string"
            exit 1
          fi
          echo "PASS"

      - name: Assert passed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
