name: Test output file feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files with differences
        run: |
          printf "A\nB\nC\nD\n" > /tmp/old.txt
          printf "A\nB\nC\nD\nE\n" > /tmp/new.txt

      - id: action
        uses: .
        with:
          old: /tmp/old.txt
          new: /tmp/new.txt
          mode: addition
          tolerance: same
          output: /tmp/diff-output.txt
        continue-on-error: true

      - name: Assert output file was created
        run: |
          if [ ! -f /tmp/diff-output.txt ]; then
            echo "FAIL: output file /tmp/diff-output.txt was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file contains diff content
        run: |
          CONTENT="$(cat /tmp/diff-output.txt)"
          echo "output file content: $CONTENT"
          NORM="$(echo "$CONTENT" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$CONTENT" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected diff content in output file but got: $CONTENT"
            exit 1
          fi
          echo "PASS: output file contains diff content"

      - name: Assert step output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "step output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty step output"
            exit 1
          fi
          echo "PASS: step output is non-empty"
