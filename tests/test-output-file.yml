name: Test output file writing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files with differences
        run: |
          printf "apple\nbanana\ncherry\n" > /tmp/fruits_old.txt
          printf "apple\nbanana\ncherry\ndate\n" > /tmp/fruits_new.txt

      - id: diff
        uses: .
        continue-on-error: true
        with:
          old: /tmp/fruits_old.txt
          new: /tmp/fruits_new.txt
          mode: strict
          tolerance: same
          output: /tmp/diff_output.txt

      - name: Assert output file was created
        run: |
          if [ ! -f /tmp/diff_output.txt ]; then
            echo "FAIL: output file /tmp/diff_output.txt was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file is non-empty
        run: |
          CONTENT="$(cat /tmp/diff_output.txt)"
          echo "output file content: '$CONTENT'"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: output file is empty, expected diff content"
            exit 1
          fi
          echo "PASS: output file has content"

      - name: Assert output step output matches file content
        env:
          STEP_OUTPUT: ${{ steps.diff.outputs.output }}
        run: |
          echo "step output: '$STEP_OUTPUT'"
          if [ -z "$STEP_OUTPUT" ]; then
            echo "FAIL: step output is empty"
            exit 1
          fi
          echo "PASS: step output is non-empty"

      - name: Assert passed is false (files differ in strict mode)
        env:
          ACTUAL: ${{ steps.diff.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected passed=false for different files in strict mode, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
