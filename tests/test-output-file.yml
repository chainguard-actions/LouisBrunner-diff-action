name: Test output file writing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture files
        run: |
          printf 'A\nB\nC\nD\n' > /tmp/file_old.txt
          printf 'A\nB\nC\nD\nE\n' > /tmp/file_new.txt

      - id: diff
        uses: .
        with:
          old: /tmp/file_old.txt
          new: /tmp/file_new.txt
          mode: strict
          tolerance: same
          output: /tmp/diff_output.txt
        continue-on-error: true

      - name: Assert output file was created
        run: |
          if [ ! -f /tmp/diff_output.txt ]; then
            echo "FAIL: output file /tmp/diff_output.txt was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file is non-empty
        run: |
          CONTENT=$(cat /tmp/diff_output.txt)
          echo "output file content: '$CONTENT'"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: output file is empty, expected diff content"
            exit 1
          fi
          echo "PASS"

      - name: Assert passed output is false
        env:
          ACTUAL: ${{ steps.diff.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected passed=false when files differ"
            exit 1
          fi
          echo "PASS"
