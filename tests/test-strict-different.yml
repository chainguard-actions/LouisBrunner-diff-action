name: Test strict mode with different files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture files
        run: |
          printf 'A\nB\nC\nD\n' > /tmp/file_old.txt
          printf 'A\nC\nD\n' > /tmp/file_new.txt

      - id: action
        uses: .
        with:
          old: /tmp/file_old.txt
          new: /tmp/file_new.txt
          mode: strict
          tolerance: same
        continue-on-error: true

      - name: Assert passed output is false
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
