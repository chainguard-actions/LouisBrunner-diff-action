name: Test strict diff with different files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create different test files
        run: |
          printf "line1\nline2\nline3\n" > /tmp/old_file.txt
          printf "line1\nline2\nline3\nline4\n" > /tmp/new_file.txt

      - id: diff
        uses: .
        continue-on-error: true
        with:
          old: /tmp/old_file.txt
          new: /tmp/new_file.txt
          mode: strict
          tolerance: same

      - name: Assert passed is false
        env:
          ACTUAL: ${{ steps.diff.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected passed=false for different files in strict mode, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output contains diff content
        env:
          ACTUAL: ${{ steps.diff.outputs.output }}
        run: |
          echo "actual output: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected diff output but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff output is present"
