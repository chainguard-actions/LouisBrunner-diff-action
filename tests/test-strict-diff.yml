name: Test strict mode with differences (should fail diff check)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create different test files
        run: |
          printf "A\nB\nC\nD\n" > /tmp/old.txt
          printf "A\nB\nC\nD\nE\n" > /tmp/new.txt

      - id: action
        uses: .
        with:
          old: /tmp/old.txt
          new: /tmp/new.txt
          mode: strict
          tolerance: same
        # The action calls core.setFailed when diff check fails, so continue-on-error
        continue-on-error: true

      - name: Assert passed is false (strict mode with differences)
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected passed=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: correctly detected difference in strict mode"

      - name: Assert output contains diff content
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual output: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff output is present"
